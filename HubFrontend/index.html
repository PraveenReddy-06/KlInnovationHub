<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Logo.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>KL Innovation Hub | Student Project Showcase & Collaboration Platform</title>

    <meta
      name="description"
      content="KL Innovation Hub is a platform for KL University students to showcase innovative projects, collaborate with peers, discover student work, and build their technical portfolio."
    />

    <meta
      name="keywords"
      content="KL Innovation Hub, KL University, student projects, project showcase, engineering projects, innovation, collaboration, software projects, AI projects, web development, hackathon, student portfolio"
    />

    <meta name="author" content="KL Innovation Hub Team" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#021024" />

    <!-- Canonical -->
    <link rel="canonical" href="https://klinnovationhub.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KL Innovation Hub" />
    <meta property="og:url" content="https://klinnovationhub.app/" />

    <meta
      property="og:title"
      content="KL Innovation Hub | Student Project Showcase & Collaboration"
    />

    <meta
      property="og:description"
      content="Explore innovative student projects, collaborate with talented students, form teams, and showcase your work."
    />

    <meta property="og:image" content="https://klinnovationhub.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="KL Innovation Hub | Student Project Showcase"
    />

    <meta
      name="twitter:description"
      content="Showcase projects, collaborate with students, and explore innovation."
    />

    <meta
      name="twitter:image"
      content="https://klinnovationhub.app/og-image.png"
    />

      "url":"https://klinnovationhub.app/",
      "description":"A platform for KL University students to showcase projects, collaborate with peers, and explore innovation."

        dataLayer.push(arguments);

      gtag("config", "G-7HSV7BMFNQ");
