<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>KLU Innovation Hub | Student Project Platform for KL University</title>

    <meta
      name="description"
      content="KLU Innovation Hub is the student project platform for KL University. Discover innovative projects, collaborate with teammates, showcase your work, and explore student innovations."
    />

    <meta name="author" content="KL Innovation Hub Team" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#021024" />

    <!-- Canonical -->
    <link rel="canonical" href="https://klinnovationhub.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KL Innovation Hub" />
    <meta property="og:url" content="https://klinnovationhub.app/" />

    <meta
      property="og:title"
      content="KL Innovation Hub | Student Projects & Team Collaboration"
    />

    <meta
      property="og:description"
      content="Explore student projects, collaborate with teammates, and showcase innovation on KL Innovation Hub."
    />

    <meta property="og:image" content="https://klinnovationhub.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="KL Innovation Hub | Student Projects & Team Collaboration"
    />

    <meta
      name="twitter:description"
      content="Explore projects, collaborate with students, and showcase innovation at KL University."
    />

    <meta
      name="twitter:image"
      content="https://klinnovationhub.app/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [ 
        {
          "@type": "Organization",
          "name": "KLU Innovation Hub",
          "url": "https://klinnovationhub.app",
          "logo": "https://klinnovationhub.app/web-app-manifest-512x512.png"
        },
        {
          "@type": "WebSite",
          "name": "KLU Innovation Hub",
          "url": "https://klinnovationhub.app/",
          "description": "Student project platform for KL University."
        }
      ]
    }
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7HSV7BMFNQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7HSV7BMFNQ");
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
